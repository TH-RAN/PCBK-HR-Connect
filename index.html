        function getLiveDateData() {
            const liveNow = new Date();

                "มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน",
                "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"
            ];
            
            const iso = `${yearAD}-${String(liveNow.getMonth() + 1).padStart(2, '0')}-${String(liveNow.getDate()).padStart(2, '0')}`;
            const thaiText = `${liveNow.getDate()} ${thaiMonthsFull[liveNow.getMonth()]} พ.ศ. ${yearBE}`;

            return { liveNow, yearAD, yearBE, iso, thaiText, thaiMonthsFull };
        }

        function getStartDateTimestamp(startDateStr) {
            if (!startDateStr || startDateStr.trim() === '-' || startDateStr.trim() === '') {
                return 9999999999999;
            }
            const thaiMonthMap = {
                "ม.ค.": 0, "ก.พ.": 1, "มี.ค.": 2, "เม.ย.": 3, "พ.ค.": 4, "มิ.ย.": 5,
                "ก.ค.": 6, "ส.ค.": 7, "ก.ย.": 8, "ต.ค.": 9, "พ.ย.": 10, "ธ.ค.": 11
            };
            const parts = startDateStr.trim().split(/\s+/);
            if (parts.length < 3) return 9999999999999;

            const day = parseInt(parts[0], 10);
            const month = thaiMonthMap[parts[1]];
            let year = parseInt(parts[2], 10);

            if (isNaN(day) || month === undefined || isNaN(year)) return 9999999999999;
            if (year > 2400) year -= 543;

            return new Date(year, month, day).getTime();
        }

        function calculateWorkTenure(startDateStr) {
            try {
                if (!startDateStr || startDateStr.trim() === '-' || startDateStr.trim() === '') {
                    return 'ยังไม่ได้ระบุวันเริ่มงาน';
                }

                const thaiMonthMap = {
                    "ม.ค.": 0, "ก.พ.": 1, "มี.ค.": 2, "เม.ย.": 3, "พ.ค.": 4, "มิ.ย.": 5,
                    "ก.ค.": 6, "ส.ค.": 7, "ก.ย.": 8, "ต.ค.": 9, "พ.ย.": 10, "ธ.ค.": 11
                };

                const parts = startDateStr.trim().split(/\s+/);
                if (parts.length < 3) return startDateStr;

                const day = parseInt(parts[0], 10);
                const month = thaiMonthMap[parts[1]];
                let year = parseInt(parts[2], 10);

                if (isNaN(day) || month === undefined || isNaN(year)) return startDateStr;

                if (year > 2400) {
                    year -= 543;
                }

                const startDate = new Date(year, month, day);
                const now = new Date();

                if (startDate > now) {
                    return 'เริ่มงานในอนาคต';
                }

                let years = now.getFullYear() - startDate.getFullYear();
                let months = now.getMonth() - startDate.getMonth();
                let days = now.getDate() - startDate.getDate();

                if (days < 0) {
                    months -= 1;
                    const prevMonthLastDay = new Date(now.getFullYear(), now.getMonth(), 0).getDate();
                    days += prevMonthLastDay;
                }

                if (months < 0) {
                    years -= 1;
                    months += 12;
                }

                const res = [];
                if (years > 0) res.push(`${years} ปี`);
                if (months > 0) res.push(`${months} เดือน`);
                if (days > 0 || res.length === 0) res.push(`${days} วัน`);

                return res.join(' ');
            } catch (err) {
                return startDateStr || '-';
            }
        }

        // อัปโหลดและบีบอัดภาพ พร้อมบังคับอัปเดตลง Cloud ทันที
        function handleProfilePhotoUpload(e) {
            const file = e.target.files[0];
            if (!file || !currentUser) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const maxDim = 120;
                    let w = img.width;
                    let h = img.height;
                    if (w > h) {
                        if (w > maxDim) { h = Math.round(h * (maxDim / w)); w = maxDim; }
                    } else {
                        if (h > maxDim) { w = Math.round(w * (maxDim / h)); h = maxDim; }
                    }
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);

                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.70);

                    const empIdx = employees.findIndex(emp => String(emp.id) === String(currentUser.id));
                    if (empIdx !== -1) {
                        employees[empIdx].avatar = compressedBase64;
                    }
                    currentUser.avatar = compressedBase64;

                    localStorage.setItem(`pcbk_avatar_${currentUser.id}`, compressedBase64);
                    
                    // บันทึกขึ้น Cloud ทันทีและรอให้เสร็จ
                    saveEmployeesToCloud().then(() => {
                        updateUserSessionUI();
                        renderTodayDashboard();
                        renderStaffDirectory();
                        showToast("อัปโหลดรูปภาพและซิงก์ขึ้น Cloud สำเร็จแล้ว");
                    });
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

            tabs.forEach(id => {
                const btn = document.getElementById(`tab-btn-${id}`);
                const content = document.getElementById(`tab-${id}`);
                if (btn) {
                    if (id === tabId) {
                        btn.classList.add('tab-active');
                        btn.classList.remove('text-slate-600');
                    } else {
                        btn.classList.remove('tab-active');
                        btn.classList.add('text-slate-600');
                    }
                }
                if (content) {
                    if (id === tabId) content.classList.remove('hidden');
                    else content.classList.add('hidden');
                }
            });

            if (tabId === 'dashboard') {
                renderTodayDashboard();
                setTimeout(renderDashboardCharts, 100);
            }
            if (tabId === 'summary') renderSummaryTable();
            if (tabId === 'approval-center') renderApprovalQueue();
            if (tabId === 'directory') renderStaffDirectory();
            if (tabId === 'request-form') {
                renderEmpSelectOptions('form-emp-id');
                handleFormEmpChange();
            }
            if (tabId === 'profile') renderProfileTab();
        }

        function loadInitialData() {
            try {
                const masterEmp = localStorage.getItem('pcbk_master_employees');
                const masterReq = localStorage.getItem('pcbk_master_requests');

                if (masterEmp && JSON.parse(masterEmp).length > 0) {
                    let parsed = JSON.parse(masterEmp);
                    employees = parsed.filter(e => String(e.id) !== '1102051');
                    employees.forEach((e, idx) => e.seq = idx + 1);
                } else {
                    employees = JSON.parse(JSON.stringify(defaultDataset));
                    saveLocalData();
                }

                if (masterReq) {
                    requests = JSON.parse(masterReq);
                } else {
                    requests = [];
                }

                employees.forEach(emp => {
                    const localImg = localStorage.getItem(`pcbk_avatar_${emp.id}`);
                    if (localImg && localImg.startsWith('data:image')) {
                        emp.avatar = localImg;
                    }
                });
            } catch (e) {
                employees = JSON.parse(JSON.stringify(defaultDataset));
                requests = [];
            }
        }

        function saveLocalData() {
            try {
                localStorage.setItem('pcbk_master_employees', JSON.stringify(employees));
                localStorage.setItem('pcbk_master_requests', JSON.stringify(requests));
            } catch (e) {}
        }

        // ================= CLOUD SYNC & AUTO HEALING =================
        async function syncFromCloud() {
            try {
                const res = await fetch(GOOGLE_SCRIPT_URL);
                const data = await res.json();
                
                if (data && data.status === "success") {
                    let needsCloudUpdate = false;

                    if (data.employees && Array.isArray(data.employees) && data.employees.length > 0) {
                        let cloudList = data.employees.filter(e => String(e.id) !== '1102051');
                        cloudList.forEach((cloudEmp, idx) => {
                            cloudEmp.seq = idx + 1;
                            const localAvatar = localStorage.getItem(`pcbk_avatar_${cloudEmp.id}`);
                            
                            // ถ้าใน Cloud มีรูป แต่เครื่องนี้ไม่มี ให้ดึงลงเครื่อง
                            if (cloudEmp.avatar && cloudEmp.avatar.startsWith('data:image')) {
                                localStorage.setItem(`pcbk_avatar_${cloudEmp.id}`, cloudEmp.avatar);
                            } 
                            // ถ้าเครื่องนี้มีรูป แต่ Cloud ยังไม่มี ให้ผสานแล้วเตรียมดันขึ้น
                            else if (!cloudEmp.avatar && localAvatar && localAvatar.startsWith('data:image')) {
                                cloudEmp.avatar = localAvatar;
                                needsCloudUpdate = true;
                            }
                        });
                        employees = cloudList;
                    } else {
                        needsCloudUpdate = true;
                    }

                    if (data.requests && Array.isArray(data.requests)) {
                        requests = data.requests;
                    }
                    
                    saveLocalData();
                    renderAllViews();

                    if (needsCloudUpdate) {
                        await saveEmployeesToCloud();
                    }
                }
            } catch (err) {
                console.warn("Sync from cloud failed:", err);
            }
        }

        async function saveEmployeesToCloud() {
            saveLocalData();
            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({
                        action: "SAVE_EMPLOYEES",
                        employees: employees
                    })
                });
            } catch (err) {}
        }

        async function saveAllToCloud() {
            saveLocalData();
            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({
                        action: "SAVE_ALL",
                        employees: employees,
                        requests: requests
                    })
                });
            } catch (err) {}
        }

        // ================= CHART.JS ANALYTICS ENGINE =================
        function renderDashboardCharts() {
            try {
                if (typeof Chart === 'undefined') return;

                const vacMonthly = Array(12).fill(0);
                const sickMonthly = Array(12).fill(0);
                const otherMonthly = Array(12).fill(0);

                let totalVacAll = 0;
                let totalSickAll = 0;
                let totalOtherAll = 0;

                employees.forEach(e => {
                    if (e.vacationUsedMonths) {
                        for (let m = 0; m < 12; m++) {
                            const v = parseFloat(e.vacationUsedMonths[m]) || 0;
                            vacMonthly[m] += v;
                            totalVacAll += v;
                        }
                    }
                    if (e.sickMonths) {
                        for (let m = 0; m < 12; m++) {
                            const s = parseFloat(e.sickMonths[m]) || 0;
                            sickMonthly[m] += s;
                            totalSickAll += s;
                        }
                    }
                    const oth = parseFloat(e.otherLeaveDays) || 0;
                    totalOtherAll += oth;
                });

                const barCanvas = document.getElementById('monthlyTrendBarChart');
                if (barCanvas) {
                    if (monthlyBarChartInstance) {
                        monthlyBarChartInstance.destroy();
                    }
                    const ctx = barCanvas.getContext('2d');
                    monthlyBarChartInstance = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'],
                            datasets: [
                                {
                                    label: 'ลาพักร้อน (วัน)',
                                    data: vacMonthly,
                                    backgroundColor: '#f59e0b',
                                    borderRadius: 4
                                },
                                {
                                    label: 'ลาป่วย (วัน)',
                                    data: sickMonthly,
                                    backgroundColor: '#f43f5e',
                                    borderRadius: 4
                                },
                                {
                                    label: 'ลาอื่นๆ/ภารกิจ (วัน)',
                                    data: otherMonthly,
                                    backgroundColor: '#6366f1',
                                    borderRadius: 4
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { position: 'bottom', labels: { boxWidth: 12, padding: 12, font: { family: 'Prompt', size: 11 } } }
                            },
                            scales: {
                                x: { stacked: true, grid: { display: false } },
                                y: { stacked: true, beginAtZero: true, grid: { color: '#f1f5f9' } }
                            }
                        }
                    });
                }

                const donutCanvas = document.getElementById('leaveDistributionDonutChart');
                if (donutCanvas) {
                    if (leaveDonutChartInstance) {
                        leaveDonutChartInstance.destroy();
                    }
                    const ctx = donutCanvas.getContext('2d');
                    const hasData = (totalVacAll + totalSickAll + totalOtherAll) > 0;
                    const chartData = hasData ? [totalVacAll, totalSickAll, totalOtherAll] : [1, 0, 0];
                    const chartColors = hasData ? ['#f59e0b', '#f43f5e', '#6366f1'] : ['#e2e8f0', '#e2e8f0', '#e2e8f0'];

                    leaveDonutChartInstance = new Chart(ctx, {
                        type: 'doughnut',
                        data: {
                            labels: ['ลาพักร้อน', 'ลาป่วย', 'ลาอื่นๆ / ภารกิจ'],
                            datasets: [{
                                data: chartData,
                                backgroundColor: chartColors,
                                borderWidth: 3,
                                borderColor: '#ffffff'
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { position: 'bottom', labels: { boxWidth: 12, padding: 10, font: { family: 'Prompt', size: 11 } } }
                            }
                        }
                    });

                    const grandTotalTxt = document.getElementById('grand-total-leaves-txt');
                    if (grandTotalTxt) {
                        const grandTotal = totalVacAll + totalSickAll + totalOtherAll;
                        grandTotalTxt.innerText = `${grandTotal.toFixed(2)} วัน`;
                    }
                }
            } catch (err) {
                console.warn("Chart render issue:", err);
            }
        }

        function getEmpRemainingQuotas(empId) {
            const emp = employees.find(x => x.id === empId);
            if (!emp) return { vacRem: 0, sickRem: 30 };

            let accrued = 0;
            if (emp.vacationAccrued) {
                for (let m = 0; m < 12; m++) accrued += parseFloat(emp.vacationAccrued[m]) || 0;
            }
            const usedVac = emp.vacationUsedMonths ? emp.vacationUsedMonths.reduce((a, b) => a + (parseFloat(b) || 0), 0) : 0;
            const carry = parseFloat(emp.carryVacation) || 0;
            const vacRem = Math.max(0, carry + accrued - usedVac);

            const usedSick = emp.sickMonths ? emp.sickMonths.reduce((a, b) => a + (parseFloat(b) || 0), 0) : 0;
            const sickRem = Math.max(0, 30 - usedSick);

            return { vacRem, sickRem };
        }

        function toggleDurationOptions() {

            const halfDiv = document.getElementById('option-half-day');
            const quarterDiv = document.getElementById('option-quarter-day');

        function calculateDays() {
            const durType = document.querySelector('input[name="leave_duration_type"]:checked')?.value || 'FULL';
            const countEl = document.getElementById('form-day-count');
            let days = 1;

            if (durType === 'HALF') {
                days = 0.5;
                if (countEl) countEl.innerText = '0.5 วัน (4 ชั่วโมง)';
            } else if (durType === 'QUARTER') {
                days = 0.25;
                const startTime = document.getElementById('quarter-start-time')?.value || '10:00';
                const endTime = document.getElementById('quarter-end-time')?.value || '12:00';
                if (countEl) countEl.innerText = `0.25 วัน (2 ชั่วโมง : ${startTime} - ${endTime} น.)`;
            } else {
                const startStr = document.getElementById('form-start-date')?.value;
                const endStr = document.getElementById('form-end-date')?.value;

                if (startStr && endStr) {
                    const start = new Date(startStr);
                    const end = new Date(endStr);
                    if (end >= start) {
                        const diffTime = Math.abs(end - start);
                        days = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
                        if (countEl) countEl.innerText = `${days} วัน`;
                    }
                }
            }

            const empId = document.getElementById('form-emp-id')?.value;
            const leaveType = document.querySelector('input[name="leave_type"]:checked')?.value || 'ลาพักร้อน';
            const warningBox = document.getElementById('leave-quota-warning');
            const warningTxt = document.getElementById('leave-quota-warning-txt');
            const submitBtn = document.getElementById('btn-submit-form');

            if (empId) {
                const quota = getEmpRemainingQuotas(empId);
                let isExceeded = false;
                let message = '';

                if (leaveType === 'ลาพักร้อน' && days > quota.vacRem) {
                    isExceeded = true;
                    message = `ไม่สามารถลาพักร้อนเกินสิทธิ์ที่เหลืออยู่ได้ (ต้องการลา ${days} วัน แต่สิทธิ์คงเหลือ ${quota.vacRem.toFixed(2)} วัน)`;
                } else if (leaveType === 'ลาป่วย' && days > quota.sickRem) {
                    isExceeded = true;
                    message = `ไม่สามารถลาป่วยเกินโควตากฎหมายแรงงานได้ (สิทธิ์คงเหลือ ${quota.sickRem.toFixed(2)} วัน)`;
                }

                if (isExceeded) {
                    if (warningBox) warningBox.classList.remove('hidden');
                    if (warningTxt) warningTxt.innerText = message;
                    if (submitBtn) {
                        submitBtn.disabled = true;
                        submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
                    }
                } else {
                    if (warningBox) warningBox.classList.add('hidden');
                    if (submitBtn) {
                        submitBtn.disabled = false;
                        submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    }
                }
            }

            return days;
        }

        async function handleLeaveSubmit(e) {
            e.preventDefault();
            const empId = document.getElementById('form-emp-id').value;
            const emp = employees.find(x => x.id === empId);
            if (!emp) {
                showToast("กรุณาเลือกชื่อพนักงาน");
                return;
            }

            let type = document.querySelector('input[name="leave_type"]:checked')?.value || 'ลาพักร้อน';
            const durType = document.querySelector('input[name="leave_duration_type"]:checked')?.value || 'FULL';
            const startDate = document.getElementById('form-start-date').value;
            let endDate = document.getElementById('form-end-date').value;
            if (durType === 'HALF' || durType === 'QUARTER') endDate = startDate;

            const days = calculateDays();
            let reason = document.getElementById('form-reason').value;

            if (type === 'ลาอื่นๆ') {
                const otherDetail = document.getElementById('form-other-type-detail')?.value.trim();
                if (otherDetail) {
                    type = `ลาอื่นๆ (${otherDetail})`;
                }
            }

            if (durType === 'HALF') {
                const halfPeriod = document.querySelector('input[name="half_day_period"]:checked')?.value || 'ครึ่งวัน';
                reason = `[${halfPeriod}] ${reason}`;
            } else if (durType === 'QUARTER') {
                const startTime = document.getElementById('quarter-start-time')?.value || '10:00';
                const endTime = document.getElementById('quarter-end-time')?.value || '12:00';
                reason = `[ลาออกจากออฟฟิศ 2 ชม. (${startTime} - ${endTime} น.)] ${reason}`;
            }

            const d = getLiveDateData();
            const newReq = {
                id: `REQ-${Date.now().toString().slice(-4)}`,
                empId: emp.id,
                empName: formatDisplayName(emp),
                type: type,
                startDate: startDate,
                endDate: endDate,
                days: days,
                reason: reason,
                approverEmail: 'Secretary.fine@gmail.com',
                status: 'รออนุมัติ',
                createdAt: d.iso,
                year: d.yearBE.toString()
            };

            const submitBtn = document.getElementById('btn-submit-form');
            const originalBtnText = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-1"></i> กำลังส่งข้อมูลเข้าระบบ...`;

            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({
                        action: "SUBMIT_LEAVE",
                        request: newReq
                    })
                });
            } catch (err) {}

            requests.unshift(newReq);
            renderAllViews();
            document.getElementById('leave-form').reset();
            setupDynamicDates();
            toggleDurationOptions();
            toggleLeaveTypeFields();

            submitBtn.disabled = false;
            submitBtn.innerHTML = originalBtnText;
            showToast("ยื่นใบลาเข้าระบบเรียบร้อยแล้ว");
        }

        function openEmailModal(reqId) {
            const req = requests.find(r => r.id === reqId);
            if (!req) return;
            activeModalReqId = reqId;

            const isPend = !isApprovedStatus(req.status) && !isRejectedStatus(req.status);
            const canManage = isExecutiveOrAdmin();

            document.getElementById('email-emp-name').innerText = req.empName;
            document.getElementById('email-detail-type').innerText = `${req.type} (${req.days} วัน)`;
            document.getElementById('email-detail-dates').innerText = `${req.startDate} ถึง ${req.endDate} (${req.days} วัน)`;
            document.getElementById('email-detail-reason').innerText = req.reason;

            const btnApprove = document.getElementById('email-btn-approve');
            const btnReject = document.getElementById('email-btn-reject');

            if (canManage && isPend) {
                btnApprove.classList.remove('hidden');
                btnReject.classList.remove('hidden');
                btnApprove.onclick = function() { approveLeaveRequest(req.id); closeEmailModal(); };
                btnReject.onclick = function() { rejectLeaveRequest(req.id); closeEmailModal(); };
            } else {
                btnApprove.classList.add('hidden');
                btnReject.classList.add('hidden');
            }

            document.getElementById('email-modal').classList.remove('hidden');
        }

        async function approveLeaveRequest(reqId) {
            if (!isExecutiveOrAdmin()) {
                alert("ต้องใช้สิทธิ์ผู้บริหารหรือผู้ดูแลระบบ (Admin) ในการอนุมัติ");
                return;
            }
            const req = requests.find(r => r.id === reqId);
            if (req && !isApprovedStatus(req.status)) {
                req.status = 'อนุมัติแล้ว';

                const emp = employees.find(e => e.id === req.empId);
                if (emp) {
                    const leaveDate = new Date(req.startDate);
                    const monthIdx = !isNaN(leaveDate.getMonth()) ? leaveDate.getMonth() : 0;

                    if (req.type.includes('พักร้อน')) {
                        if (!emp.vacationUsedMonths) emp.vacationUsedMonths = Array(12).fill(0);
                        emp.vacationUsedMonths[monthIdx] = (parseFloat(emp.vacationUsedMonths[monthIdx]) || 0) + parseFloat(req.days);
                    } else if (req.type.includes('ป่วย')) {
                        if (!emp.sickMonths) emp.sickMonths = Array(12).fill(0);
                        emp.sickMonths[monthIdx] = (parseFloat(emp.sickMonths[monthIdx]) || 0) + parseFloat(req.days);
                    } else {
                        emp.otherLeaveDays = (parseFloat(emp.otherLeaveDays) || 0) + parseFloat(req.days);
                    }
                }

                renderAllViews();
                await saveAllToCloud();
                showToast(`อนุมัติวันลาของ ${req.empName} และตัดยอดลงตารางเรียบร้อยแล้ว`);
            }
        }

        async function rejectLeaveRequest(reqId) {
            if (!isExecutiveOrAdmin()) {
                alert("ต้องใช้สิทธิ์ผู้บริหารหรือผู้ดูแลระบบ (Admin) ในการปฏิเสธ");
                return;
            }
            const req = requests.find(r => r.id === reqId);
            if (req) {
                req.status = 'ไม่อนุมัติ';
                renderAllViews();
                await saveAllToCloud();
                showToast(`ปฏิเสธคำขอลางานของ ${req.empName} แล้ว`);
            }
        }

        function triggerExcelImport() {
            if (!isAdmin) {
                alert("กรุณาเข้าสู่ระบบในฐานะ Admin เพื่อนำเข้าไฟล์ Excel");
                return;
            }
            document.getElementById('excel-file-input').click();
        }

        function handleExcelFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    showToast("นำเข้าข้อมูลจาก Excel เรียบร้อยแล้ว");
                } catch (err) {
                    showToast("เกิดข้อผิดพลาดในการอ่านไฟล์ Excel");
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function exportSummaryToExcel() {
            const d = getLiveDateData();
            const dataToExport = employees.map(e => {
                const totalAccrued = e.vacationAccrued ? e.vacationAccrued.reduce((s, v) => s + (parseFloat(v) || 0), 0) : 0;
                const totalVacUsed = e.vacationUsedMonths ? e.vacationUsedMonths.reduce((s, v) => s + (parseFloat(v) || 0), 0) : 0;
                const totalSickUsed = e.sickMonths ? e.sickMonths.reduce((s, v) => s + (parseFloat(v) || 0), 0) : 0;
                const carry = parseFloat(e.carryVacation) || 0;
                const remVac = Math.max(0, carry + totalAccrued - totalVacUsed);

                return {
                    "ลำดับ": e.seq,
                    "รหัสพนักงาน": e.id,
                    "ชื่อ-นามสกุล": e.name,
                    "ตำแหน่ง": e.position,
                    "วันเดือนปีเกิด": e.dob,
                    "วันเริ่มงาน": e.startDate,
                    "ทบวันพักร้อนสะสมปีก่อน": carry,
                    "รวมเพิ่มพักร้อน": totalAccrued,
                    "รวมใช้พักร้อน": totalVacUsed,
                    "คงเหลือพักร้อน": remVac,
                    "รวมใช้ลาป่วย": totalSickUsed,
                    "ลาอื่นๆ/ภารกิจ": e.otherLeaveDays || 0,
                    "หมายเหตุ": e.note || ""
                };
            });
            const ws = XLSX.utils.json_to_sheet(dataToExport);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, `สรุปวันลา_${d.yearBE}`);
            XLSX.writeFile(wb, `รายงานสรุปวันลา_ปี_${d.yearBE}.xlsx`);
            showToast("ส่งออกไฟล์ Excel สำเร็จ");
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-message');
            if (!toast || !msgEl) return;
            msgEl.innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
